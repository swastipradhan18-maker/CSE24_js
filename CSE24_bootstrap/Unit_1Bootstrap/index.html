<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">

     <title>BOOTSTRAP</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
     <img src="jack-barton-DxI3QiHIuAQ-unsplash.jpg" class="img-fluid" alt="Responsive image">
     <h1>My Bootstrap Page</h1>
     <p class="lead">This is a lead paragraph for prominent text</p>

     <div class="progress">
          <div class="progress-bar" role="progressbar" style="width: 75%" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100">75%</div>
     </div>

     <div>
          <button type="button" class="btn btn-primary">Primary Button</button>
          <button type="button" class="btn btn-secondary">Secondary Button</button>
          <button type="button" class="btn btn-success">Success Button</button>
          <button type="button" class="btn btn-danger">Danger Button</button>
          <button type="button" class="btn btn-outline-secondary btn-sm">Small outline Button</button>

          <button type="button" class="btn btn-primary"><span class="badge bg-danger">1</span></button>
     </div>

     

     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
